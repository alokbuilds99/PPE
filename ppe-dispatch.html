  .brand { display:flex; align-items:center; gap:12px; padding:12px 18px 12px 0; }

  .tabs a:hover { color:#fff; } .tabs a.on { color:#fff; border-bottom-color:var(--hi); }
  .tools { margin-left:auto; display:flex; align-items:center; gap:4px; flex-wrap:wrap; padding:8px 0; }
  .tools button { background:none; border:0; color:#cfd9e8; padding:6px 10px; border-radius:6px; } .tools button:hover { background:rgba(255,255,255,.12); color:#fff; }

  h1 { font:700 40px/1.05 var(--cond); margin:0; } h2 { font:600 24px/1.15 var(--cond); margin:0 0 12px; }
  .muted { color:var(--muted); font-size:14px; } .back { display:inline-block; margin-bottom:14px; font-weight:500; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:20px; margin-top:20px; }

  /* loading bar on the home screen */
  .load { background:var(--ink); color:#fff; border-radius:6px; padding:26px 26px 22px; }
  .load p { margin:6px 0 20px; color:#c3cfdf; }
  .segs { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .seg { min-width:104px; text-decoration:none; color:#fff; display:block; }
  .seg .track { display:block; height:22px; background:#2b3f5e; border-radius:3px; overflow:hidden; }
  .seg .track i { display:block; height:100%; background:var(--hi); }
  .seg b { display:block; font:600 17px/1.2 var(--cond); margin-top:8px; white-space:nowrap; } .seg span { font-size:13px; color:#c3cfdf; white-space:nowrap; }
  .seg:hover .track { outline:2px solid var(--hi); }

  /* tables */
  .wrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-weight:600; font-size:14px; color:var(--muted); padding:8px 12px; border-bottom:2px solid var(--ink); white-space:nowrap; }
  td { padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; } td.c, th.c { text-align:center; font-variant-numeric:tabular-nums; }
  tbody tr:hover td { background:#fafbfa; }
  td.tied { box-shadow:inset 5px 0 0 var(--hi); }
  .name { font:600 19px/1.2 var(--cond); text-decoration:none; } .name:hover { text-decoration:underline; }
  tr.sub td { background:var(--ink); color:#fff; font:600 17px/1.2 var(--cond); padding:8px 12px; }
  td.due { background:var(--hi-soft); } td.done { background:var(--ok-soft); color:var(--ok); } td.none { color:#b3bcc6; }
  .big { font:600 20px/1 var(--cond); }
  .meter { height:8px; background:var(--soft); border-radius:2px; overflow:hidden; min-width:90px; } .meter i { display:block; height:100%; background:var(--ok); }

  .state::before { content:""; width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .state.part::before { background:var(--amber); } .state.full::before { background:var(--ok); }
  .kind { font-size:13px; font-weight:500; padding:2px 8px; border:1px solid var(--line); border-radius:3px; background:var(--paper); white-space:nowrap; }
  .size { display:inline-block; min-width:38px; text-align:center; font:600 16px/1 var(--cond); padding:5px 6px; border:1.5px solid var(--ink); border-radius:3px; }

</style>

  h:[0,10], g:[0,20], gog:20, toe:6, sb:[0,1,1,2,3,3,3,3,1,1], js:[2,2,2,3,3,3,1,1], jv:[0,0,3,3,3,3,2,2]},
];

// ---------- storage ----------
// Shipments live in a shared Google Sheet (through the Apps Script web app below).
// A copy is also kept in this browser so the page can still be read without internet.
const API = 'https://script.google.com/macros/s/AKfycbw--R0kEUBTBnUP6qy7JxHl-8qH58Bna7l7Qgk3LxA7iOkJ6QEITY8LuDrpzsq3zlD2dA/exec';
const KEY = 'rama-ppe-dispatch-v1';
const PINKEY = KEY + '-pin';
let DB = { seq: 0, dispatches: [] };
try { DB = JSON.parse(localStorage.getItem(KEY)) || DB; } catch (e) {}
function upgrade() {            // records saved by the first version had one site each
  DB.dispatches.forEach((d) => {
    if (!d.sites) d.sites = [d.site];
    d.lines.forEach((l) => { if (!l.site) l.site = l.key.split('|')[0]; });
  });
}
upgrade();
const save = () => localStorage.setItem(KEY, JSON.stringify(DB));

async function cloud(action, extra = {}) {
  const pin = localStorage.getItem(PINKEY) || prompt('Enter the team PIN') || '';
  const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ pin, action, ...extra }) });
  const out = await res.json();
  if (!out.ok) {
    if (out.error === 'pin') localStorage.removeItem(PINKEY);
    throw new Error(out.error === 'pin' ? 'wrong PIN' : out.error);
  }
  localStorage.setItem(PINKEY, pin);
  return out;
}
function apply(out) { DB = { seq: out.seq, dispatches: out.dispatches }; upgrade(); save(); }
async function sync() {
  try {
    let out = await cloud('load');
    if (!out.dispatches.length && DB.dispatches.length)   // first run: upload what this browser already has
      out = await cloud('replace', { seq: DB.seq, dispatches: DB.dispatches });
    apply(out);
    const h = location.hash;
    if (h.startsWith('#site/')) siteView(h.slice(6), grab()); else route();
  } catch (e) { toast('Could not reach the shared sheet (' + e.message + '). Showing the copy on this device.', true); }
}

// ---------- helpers ----------
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => Number(n).toLocaleString('en-IN');
const siteBy = (c) => SITES.find((s) => s.c === c);
const itemBy = (id) => ITEMS.find((i) => i.id === id);
const itemLabel = (id) => { const i = itemBy(id); return i.name + (i.brand ? ` (${i.brand})` : ''); };
const fullName = (s) => `${s.name} (${s.kind})`;
const matesOf = (c) => (GROUPS.find((g) => g.includes(c)) || []).filter((x) => x !== c);
const pct = (done, req) => (req > 0 ? Math.min(100, Math.round(done / req * 100)) : 0);
const meter = (done, req) => `<div class="meter"><i style="width:${pct(done, req)}%"></i></div>`;
const state = (req, done) => done >= req ? '<span class="state full">Complete</span>'
  : done > 0 ? '<span class="state part">Partly sent</span>' : '<span class="state">Not started</span>';
const gstOk = (s) => /^\d{2}[A-Z]/.test(s.gst);

let toastTimer;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 3600);
}

function linesFor(s) {
  const out = [], shoeIt = s.kind === 'Project' ? 'comp' : 'shoe';
  const push = (key, it, size, a, b) => { if (a + b) out.push({ key, site: s.c, it, item: itemLabel(it), size, staff: a, vb: b }); };
  SHOE.forEach((z, i) => push(`${s.c}|shoe|${z}`, shoeIt, String(z), (s.ss || [])[i] || 0, (s.sb || [])[i] || 0));
  push(`${s.c}|helmet|`, 'helmet', '', s.h[0], s.h[1]);
  push(`${s.c}|gloves|`, 'gloves', '', s.g[0], s.g[1]);
  push(`${s.c}|spec|`, 'spec', '', 0, s.gog);
  push(`${s.c}|toe|`, 'toe', '', s.toe, 0);
  JKT.forEach((z, i) => push(`${s.c}|jacket|${z}`, 'jacket', z, (s.js || [])[i] || 0, (s.jv || [])[i] || 0));
  return out;
}
function sentMap() {
  const m = {};
  DB.dispatches.forEach((d) => d.lines.forEach((l) => { m[l.key] = (m[l.key] || 0) + l.qty; }));
  return m;
}
function tally(lines, sent) {
  const req = lines.reduce((t, l) => t + l.staff + l.vb, 0), done = lines.reduce((t, l) => t + (sent[l.key] || 0), 0);
  return { req, done, bal: req - done };
}
function ordered() {            // keep entries that can ship together next to each other
  const out = [];
  SITES.forEach((s) => {
    const g = GROUPS.find((x) => x.includes(s.c));
    (g ? g.map(siteBy) : [s]).forEach((x) => { if (!out.includes(x)) out.push(x); });
  });
  return out;
}

// ---------- routing ----------
const app = document.getElementById('app');
let combo = { base: null, extra: new Set() };
function route() {
  const h = location.hash.slice(1);
  const nav = h.startsWith('item') ? 'items' : h === 'all' ? 'all' : 'sites';
  document.querySelectorAll('.tabs a').forEach((a) => a.classList.toggle('on', a.dataset.nav === nav));
  window.scrollTo(0, 0);
  if (h.startsWith('site/')) return siteView(h.slice(5));
  if (h.startsWith('item/')) return itemView(h.slice(5));
  if (h === 'items') return itemsView();
  if (h === 'all') return allView();
  listView();
}
window.addEventListener('hashchange', route);

// ---------- places ----------
function listView() {
  const sent = sentMap();
  let R = 0, D = 0, complete = 0;
  const rows = ordered().map((s) => {
    const t = tally(linesFor(s), sent); R += t.req; D += t.done; if (t.bal === 0) complete++;
    const mates = matesOf(s.c).map((c) => fullName(siteBy(c))).join(', ');
    return `<tr data-s="${esc((s.name + ' ' + s.kind + ' ' + s.city).toLowerCase())}">
      <td class="${mates ? 'tied' : ''}"><a class="name" href="#site/${s.c}">${esc(s.name)}</a>
        ${mates ? `<div class="muted">Can ship with ${esc(mates)}</div>` : ''}</td>
      <td><span class="kind">${esc(s.kind)}</span></td><td>${esc(s.city)}</td>
      <td class="n">${fmt(t.req)}</td><td class="n">${fmt(t.done)}</td><td class="n big">${fmt(t.bal)}</td>
      <td>${meter(t.done, t.req)}</td><td>${state(t.req, t.done)}</td>
      <td><a class="btn go small" href="#site/${s.c}">Dispatch</a></td></tr>`;
  }).join('');
  const segs = ITEMS.map((i) => {
    const t = tally(SITES.flatMap((s) => linesFor(s).filter((l) => l.it === i.id)), sent);
    return `<a class="seg" href="#item/${i.id}" style="flex:${t.req} 1 0" title="${esc(i.name)}">
      <span class="track"><i style="width:${pct(t.done, t.req)}%"></i></span>
      <b>${esc(i.short)}</b><span>${fmt(t.bal)} to send</span></a>`;
  }).join('');
  app.innerHTML = `
    <section class="load">
      <h1>${R - D > 0 ? `${fmt(R - D)} units still to send` : 'Everything has been dispatched'}</h1>
      <p>${fmt(D)} of ${fmt(R)} dispatched in ${DB.dispatches.length} shipment${DB.dispatches.length === 1 ? '' : 's'}.
         ${complete} of ${SITES.length} places are complete. Each bar below is one PPE item.</p>
      <div class="segs">${segs}</div>
    </section>
    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px">
        <h2 style="margin:0">Places to deliver</h2>
        <input class="search" placeholder="Search place or city" aria-label="Search place or city" oninput="filterSites(this.value)"></div>
      <div class="wrap"><table><thead><tr><th>Place</th><th>Type</th><th>City</th><th class="n">Required</th>
        <th class="n">Dispatched</th><th class="n">Balance</th><th>Progress</th><th>Status</th><th></th></tr></thead>
        <tbody id="site-rows">${rows}</tbody></table></div>
    </section>`;
}
function filterSites(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('#site-rows tr').forEach((tr) => { tr.style.display = tr.dataset.s.includes(q) ? '' : 'none'; });
}

// ---------- PPE items ----------
function itemsView() {
  const sent = sentMap();
  app.innerHTML = `<h1>PPE items</h1><p class="muted" style="margin:6px 0 0">Choose an item to see every place it has to go.</p>
    <div class="tiles">${ITEMS.map((i) => {
      const L = SITES.flatMap((s) => linesFor(s).filter((l) => l.it === i.id)), t = tally(L, sent);
      const places = new Set(L.map((l) => l.site)).size;
      return `<a class="tile" href="#item/${i.id}"><h2>${esc(i.name)}</h2><div class="muted">${esc(i.brand) || '&nbsp;'}</div>
        <div class="left">${fmt(t.bal)}</div><div class="muted">still to send, out of ${fmt(t.req)}</div>
        ${meter(t.done, t.req)}
        <div class="muted">${places} places. Approved order ${fmt(i.approved)}.</div>
        ${t.req > i.approved ? `<div class="short">Order is short by ${fmt(t.req - i.approved)}</div>` : ''}</a>`;
    }).join('')}</div>`;
}

function itemView(id) {
  const i = itemBy(id);
  if (!i) return itemsView();
  const sent = sentMap(), sizes = i.sizes || [];
  const rows = ordered().map((s) => ({ s, L: linesFor(s).filter((l) => l.it === id) })).filter((x) => x.L.length);
  const all = tally(rows.flatMap((x) => x.L), sent);
  const cell = (L, z) => { const l = L.find((x) => x.size === z); if (!l) return '<td class="c none">–</td>';
    const req = l.staff + l.vb, bal = req - (sent[l.key] || 0);
    return `<td class="c ${bal ? 'due' : 'done'}"><b>${bal}</b><span class="muted"> of ${req}</span></td>`; };
  app.innerHTML = `
    <a class="back" href="#items">Back to all PPE items</a>
    <h1>${esc(i.name)}</h1><div class="muted">${esc(i.brand)}</div>
    <div class="facts">
      <div><b>${fmt(all.bal)}</b><span>still to send</span></div>
      <div><b>${fmt(all.done)}</b><span>dispatched</span></div>
      <div><b>${fmt(all.req)}</b><span>required at ${rows.length} places</span></div>
      <div><b>${fmt(i.approved)}</b><span>approved order</span></div>
    </div>
    ${all.req > i.approved ? `<div class="alert"><b>The order is short.</b> Places need ${fmt(all.req)} but the approved order is ${fmt(i.approved)}, so ${fmt(all.req - i.approved)} cannot be supplied from it.</div>` : ''}
    <section class="panel"><h2>Where it has to go</h2>
      ${sizes.length ? '<p class="muted" style="margin-top:-6px">Each size shows the balance left out of the quantity required. Yellow still has to go, green is done.</p>' : ''}
      <div class="wrap"><table><thead><tr><th>Place</th><th>Type</th><th>City</th>${sizes.map((z) => `<th class="c">${z}</th>`).join('')}
        <th class="n">Required</th><th class="n">Dispatched</th><th class="n">Balance</th><th></th></tr></thead>
      <tbody>${rows.map(({ s, L }) => { const t = tally(L, sent); return `<tr>
        <td><a class="name" href="#site/${s.c}">${esc(s.name)}</a></td><td><span class="kind">${esc(s.kind)}</span></td><td>${esc(s.city)}</td>
        ${sizes.map((z) => cell(L, z)).join('')}
        <td class="n">${fmt(t.req)}</td><td class="n">${fmt(t.done)}</td><td class="n big">${fmt(t.bal)}</td>
        <td>${t.bal ? `<a class="btn go small" href="#site/${s.c}">Dispatch</a>` : state(1, 1)}</td></tr>`; }).join('')}
      </tbody></table></div></section>`;
}

// ---------- one place (optionally combined with same-address entries) ----------
const grab = () => Object.fromEntries([...document.querySelectorAll('input.q')].filter((i) => i.value).map((i) => [i.dataset.key, i.value]));

function siteView(code, keep = {}) {
  const s = siteBy(code);
  if (!s) return listView();
  if (combo.base !== code) combo = { base: code, extra: new Set() };
  const sent = sentMap(), codes = [code, ...combo.extra], mates = matesOf(code);
  const t = tally(codes.flatMap((c) => linesFor(siteBy(c))), sent);
  const mine = DB.dispatches.filter((d) => d.sites.includes(code));
  const f = (id, label, type = 'text', val = '') => `<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${val}"></div>`;

  const body = codes.map((c) => { const x = siteBy(c); return `
    ${codes.length > 1 ? `<tr class="sub"><td colspan="8">${esc(fullName(x))}</td></tr>` : ''}
    ${linesFor(x).map((l) => { const req = l.staff + l.vb, done = sent[l.key] || 0, bal = req - done; return `<tr>
      <td>${esc(l.item)}</td><td>${l.size ? `<span class="size">${esc(l.size)}</span>` : ''}</td>
      <td class="n">${l.staff}</td><td class="n">${l.vb}</td><td class="n">${req}</td><td class="n">${done}</td>
      <td class="n big">${bal ? bal : '<span class="state full">Done</span>'}</td>
      <td class="n" style="white-space:nowrap">${bal ? `<button class="small quiet" onclick="setMax(this)">All</button> ` : ''}
        <input class="q" type="number" min="0" max="${bal}" data-key="${l.key}" value="${esc(keep[l.key] || '')}" aria-label="Send now" ${bal ? '' : 'disabled'}></td></tr>`; }).join('')}`; }).join('');

  app.innerHTML = `
  <a class="back" href="#">Back to all places</a>
  <section class="label"><div class="stripe"></div><div class="label-body">
    <div><div class="to">Deliver to</div>
      <h1>${codes.map((c) => esc(siteBy(c).name) + ` <span class="kind">${esc(siteBy(c).kind)}</span>`).join(' + ')}</h1>
      <p class="address">${esc(s.addr)}</p>
      <button onclick="copyAddr('${s.c}')">Copy address</button></div>
    <dl><div><dt>GST number</dt><dd class="${gstOk(s) ? '' : 'missing'}">${esc(s.gst)}</dd></div>
      <div><dt>Contact</dt><dd class="${s.contact ? '' : 'missing'}">${esc(s.contact) || 'Not in address file'}</dd></div>
      <div><dt>Progress</dt><dd>${fmt(t.done)} of ${fmt(t.req)} sent</dd></div></dl>
  </div></section>

  ${mates.length ? `<section class="together"><h2>Send in one shipment and pay freight once</h2>
    <div class="muted">Quantities are still counted separately for each entry. Check the addresses match before combining.</div>
    ${mates.map((m) => { const x = siteBy(m), bal = tally(linesFor(x), sent).bal; return `<label>
      <input type="checkbox" ${combo.extra.has(m) ? 'checked' : ''} onchange="toggleMate('${code}','${m}',this.checked)">
      <span><b>Also include ${esc(fullName(x))}</b>, balance ${fmt(bal)}<br><span class="muted">${esc(x.addr)}</span></span></label>`; }).join('')}
  </section>` : ''}

  <section class="panel"><h2>What to send</h2>
    <div class="wrap"><table id="pick"><thead><tr><th>PPE item</th><th>Size</th><th class="n">Staff</th><th class="n">Visitor / buffer</th>
      <th class="n">Required</th><th class="n">Dispatched</th><th class="n">Balance</th><th class="n">Send now</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    <h2 style="margin-top:26px">Shipment details</h2>
    <div class="fields">
      ${f('d-date', 'Dispatch date', 'date', new Date().toISOString().slice(0, 10))}
      ${f('d-transporter', 'Transporter')}${f('d-lr', 'LR number')}${f('d-tracking', 'Tracking number')}
      ${f('d-vehicle', 'Vehicle number')}${f('d-invoice', 'Invoice number')}${f('d-challan', 'Delivery challan number')}
      ${f('d-remarks', 'Remarks')}
    </div>
    <div class="dock"><span class="count" id="now">0</span><span>units in this shipment${codes.length > 1 ? ' (combined)' : ''}</span><span class="grow"></span>
      <button onclick="fillAll()">Fill full balance</button><button onclick="clearAll()">Clear</button>
      <button class="go" onclick="saveDispatch('${s.c}')">Save shipment</button></div>
  </section>

  <section class="panel"><h2>Shipments to this place</h2>${dispatchTable(mine)}</section>`;
  document.getElementById('pick').addEventListener('input', updateDock);
  updateDock();
}
function updateDock() {
  let n = 0;
  document.querySelectorAll('input.q').forEach((i) => { const v = parseInt(i.value, 10) || 0; n += v; i.classList.toggle('over', v > +i.max); });
  document.getElementById('now').textContent = fmt(n);
}
function setMax(btn) { const i = btn.closest('tr').querySelector('input.q'); i.value = i.max; updateDock(); }
function toggleMate(code, mate, on) {
  const keep = grab();
  if (on) combo.extra.add(mate); else combo.extra.delete(mate);
  siteView(code, keep);
}
function fillAll() { document.querySelectorAll('input.q:not(:disabled)').forEach((i) => { i.value = i.max; }); updateDock(); }
function clearAll() { document.querySelectorAll('input.q').forEach((i) => { i.value = ''; }); updateDock(); }
function copyAddr(code) {
  const s = siteBy(code);
  const text = `${fullName(s)}\n${s.addr}\nGST: ${s.gst}\nContact: ${s.contact}`;
  navigator.clipboard.writeText(text).then(() => toast('Address copied'), () => prompt('Copy the address:', text));
}

let busy = false;
async function saveDispatch(code) {
  if (busy) return;
  const codes = [code, ...combo.extra];
  const known = new Map(codes.flatMap((c) => linesFor(siteBy(c))).map((l) => [l.key, l]));
  const lines = [];
  for (const i of document.querySelectorAll('input.q')) {
    const qty = parseInt(i.value, 10) || 0;
    if (qty <= 0) continue;
    const l = known.get(i.dataset.key);
    if (qty > +i.max) { i.focus(); return toast(`${l.item} ${l.size} for ${fullName(siteBy(l.site))}: only ${i.max} left to send, you entered ${qty}.`, true); }
    lines.push({ key: l.key, site: l.site, it: l.it, item: l.item, size: l.size, qty });
  }
  if (!lines.length) return toast('Enter a quantity under "Send now" on at least one line.', true);
  const v = (id) => document.getElementById(id).value.trim();
  const dispatch = { id: String(Date.now()), no: '',
    sites: codes.filter((c) => lines.some((l) => l.site === c)), date: v('d-date'),
    transporter: v('d-transporter'), lr: v('d-lr'), tracking: v('d-tracking'), vehicle: v('d-vehicle'),
    invoice: v('d-invoice'), challan: v('d-challan'), remarks: v('d-remarks'), lines };
  busy = true; toast('Saving…');
  try {
    const out = await cloud('add', { dispatch });
    apply(out); siteView(code);
    toast(`Shipment ${out.no} saved, ${fmt(lines.reduce((t, l) => t + l.qty, 0))} units`);
  } catch (e) { toast('Not saved (' + e.message + '). Check the internet and press Save again.', true); }
  busy = false;
}

// ---------- shipments ----------
function allView() {
  app.innerHTML = `<h1>Shipments</h1><p class="muted" style="margin:6px 0 0">${DB.dispatches.length} saved in the shared sheet.</p>
    <section class="panel">${dispatchTable(DB.dispatches)}</section>`;
}
function dispatchTable(list) {
  if (!list.length) return '<p class="muted" style="margin:0">Nothing sent yet. Open a place, enter the quantities and save the shipment.</p>';
  return `<div class="wrap"><table><thead><tr><th>Shipment</th><th>Date</th><th>Delivered to</th><th>Items sent</th>
    <th class="n">Units</th><th>Transporter</th><th>LR and tracking</th><th>Vehicle</th><th>Invoice</th><th>Challan</th><th></th></tr></thead>
  <tbody>${[...list].reverse().map((d) => `<tr>
    <td><span class="big">${esc(d.no)}</span>${d.sites.length > 1 ? '<div><span class="kind">Combined</span></div>' : ''}</td><td style="white-space:nowrap">${esc(d.date)}</td>
    <td>${d.sites.map((c) => `<a href="#site/${c}">${esc(fullName(siteBy(c)))}</a>`).join('<br>')}</td>
    <td class="muted">${d.lines.map((l) => `${esc(l.item)}${l.size ? ' size ' + esc(l.size) : ''}, ${l.qty}${d.sites.length > 1 ? ` <span class="kind">${esc(siteBy(l.site).kind)}</span>` : ''}`).join('<br>')}</td>
    <td class="n big">${fmt(d.lines.reduce((t, l) => t + l.qty, 0))}</td><td>${esc(d.transporter)}</td>
    <td>${esc(d.lr)}${d.tracking ? '<br>' + esc(d.tracking) : ''}</td><td>${esc(d.vehicle)}</td><td>${esc(d.invoice)}</td><td>${esc(d.challan)}</td>
    <td style="white-space:nowrap"><button class="small" onclick="printSlip('${d.id}')">Print slip</button>
      <button class="small danger" onclick="removeDispatch('${d.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`;
}
async function removeDispatch(id) {
  const d = DB.dispatches.find((x) => x.id === id);
  if (!confirm(`Delete ${d.no}? Its quantities go back to the balance.`)) return;
  try { apply(await cloud('delete', { id })); route(); toast(`Shipment ${d.no} deleted`); }
  catch (e) { toast('Not deleted (' + e.message + ').', true); }
}

function printSlip(id) {
  const d = DB.dispatches.find((x) => x.id === id), list = d.sites.map(siteBy), first = list[0];
  const uniq = (a) => [...new Set(a.filter(Boolean))].join(' / ');
  document.getElementById('slip').innerHTML = `
    <h1>Rama Engineers dispatch slip ${esc(d.no)}</h1>
    <p><b>Date:</b> ${esc(d.date)}<br><b>Deliver to:</b> ${esc(list.map(fullName).join(' + '))}<br>${esc(first.addr)}<br>
      <b>GST:</b> ${esc(uniq(list.map((s) => s.gst)))} &nbsp; <b>Contact:</b> ${esc(uniq(list.map((s) => s.contact)))}</p>
    <p><b>Transporter:</b> ${esc(d.transporter)} &nbsp; <b>LR:</b> ${esc(d.lr)} &nbsp; <b>Tracking:</b> ${esc(d.tracking)}<br>
      <b>Vehicle:</b> ${esc(d.vehicle)} &nbsp; <b>Invoice:</b> ${esc(d.invoice)} &nbsp; <b>Challan:</b> ${esc(d.challan)}<br>
      <b>Remarks:</b> ${esc(d.remarks)}</p>
    <table><thead><tr><th>PPE item</th><th>Size</th><th class="n">Quantity</th></tr></thead><tbody>
      ${list.map((s) => { const L = d.lines.filter((l) => l.site === s.c); return `
        ${list.length > 1 ? `<tr class="sub"><td colspan="2">${esc(fullName(s))}</td><td class="n">${L.reduce((t, l) => t + l.qty, 0)}</td></tr>` : ''}
        ${L.map((l) => `<tr><td>${esc(l.item)}</td><td>${esc(l.size) || '—'}</td><td class="n">${l.qty}</td></tr>`).join('')}`; }).join('')}
      <tr><td colspan="2"><b>Total</b></td><td class="n"><b>${d.lines.reduce((t, l) => t + l.qty, 0)}</b></td></tr></tbody></table>
    <p style="margin-top:50px">Received by: ____________________ &nbsp; Date: ____________ &nbsp; Signature: ____________________</p>`;
  document.body.classList.add('printing');
  window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));

// ---------- export / backup ----------
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
const stamp = () => new Date().toISOString().slice(0, 10);
function exportCsv() {
  if (!DB.dispatches.length) return toast('There are no shipments to export yet.', true);
  const head = ['Shipment No', 'Combined Shipment', 'Date', 'Site', 'Project/Operation', 'Address', 'GST', 'Contact', 'PPE Item', 'Size', 'Quantity',
    'Transporter', 'LR Number', 'Tracking Number', 'Vehicle Number', 'Invoice Number', 'Challan Number', 'Remarks'];
  const rows = DB.dispatches.flatMap((d) => d.lines.map((l) => { const s = siteBy(l.site); return [d.no, d.sites.length > 1 ? 'Yes' : 'No',
    d.date, s.name, s.kind, s.addr, s.gst, s.contact, l.item, l.size, l.qty,
    d.transporter, d.lr, d.tracking, d.vehicle, d.invoice, d.challan, d.remarks]; }));
  const csv = [head, ...rows].map((r) => r.map((c) => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  download(`ppe-dispatches-${stamp()}.csv`, '\ufeff' + csv, 'text/csv');
}
function backup() { download(`ppe-dispatch-backup-${stamp()}.json`, JSON.stringify(DB), 'application/json'); toast('Backup file downloaded'); }
function restore(input) {
  const file = input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data.dispatches)) throw new Error();
      if (!confirm(`Replace the ${DB.dispatches.length} shipments in the shared sheet with the ${data.dispatches.length} in the backup?`)) return;
      cloud('replace', { seq: data.seq || 0, dispatches: data.dispatches })
        .then((out) => { apply(out); route(); toast('Backup restored'); })
        .catch((e) => toast('Restore failed (' + e.message + ').', true));
    } catch (e) { toast('That file is not a valid backup.', true); }
    input.value = '';
  };
  r.readAsText(file);
}

route(); sync();
</script>
